[workspace]
members = [".", "iara_genesis"]

[package]
name = "universe"
version = "0.2.0"
edition = "2024"
rust-version = "1.85.0" # Versão estável em 2026
default-run = "universe"

[dependencies]
iara_genesis = { path = "iara_genesis" }
bevy = { version = "0.16.0", default-features = false, features = [
    "bevy_pbr",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_asset",
    "bevy_winit",
    "bevy_text",
    "bevy_ui",
    "bevy_gizmos", # Essencial para depuração metafísica
    "bevy_state",
    "x11",
    "tonemapping_luts",
    "default_font",
    "multi_threaded"
] }
bitflags = "2.6"
rand = "0.9.0" # Versão ultra-rápida de 2026
rayon = "1.10" # Paralelização CPU-bound (retina raycast pra 2000+ carros)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["sentinel_brake", "survival_pressure", "simple_elitism"]
# Elitismo simples: slot 0 = champion puro, resto = champion + mutação.
# Coroação imediata se qualquer mutante bater champion (ignora validation-gate).
# Ver melhorias/simple-elitism.md
simple_elitism = []
# Hard-brake reflex quando pedal>0.4 e TTC<0.5s. Ver melhorias/gain-asymmetry.md
sentinel_brake = []
# Compensa dynamic_steer_limit no neural steer (x1/limit cap 2). Ver melhorias/gain-asymmetry.md
gain_comp_steer = []
# Remove threshold 0.2 do brake spline (simetria com throttle).
brake_symmetric = []
# Pressão existencial extra: idle_brake_penalty + corner_fuel_burn + spin_hp_drain.
# Ver melhorias/survival-pressure.md
survival_pressure = []

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bitlinear"
harness = false
