[workspace]
# `iara_genesis` foi movido para `docs/arquivo/dirs/iara_genesis` no commit "removing
# trash" (2c71c69) sem atualizar este manifesto — a crate NÃO é lixo (é dependência real
# de `src/evolution/dna_genesis.rs`, `dna_view`, `dna_compress`, `generic_dna`), só o
# caminho ficou obsoleto e quebrava TODO `cargo build` do workspace. Repontuado para o
# caminho novo; arquivos não foram movidos de volta (evita conflito com o cleanup feito).
members = [".", "docs/arquivo/dirs/iara_genesis"]

[package]
name = "universe"
version = "0.2.0"
edition = "2024"
rust-version = "1.85.0" # Versão estável em 2026
license = "MIT"
default-run = "universe"

[dependencies]
iara_genesis = { path = "docs/arquivo/dirs/iara_genesis" }
iara-perception = { path = "vendor/iara-perception" }
# Já era dependência TRANSITIVA via iara-perception (RetinaPerception usa CfcCell
# internamente). Tornada direta para que `src/math/cfc_perception.rs` possa referenciar
# `iara_cfc::CfcCell` sem duplicar a equação — ver doc daquele módulo. Mesma crate,
# mesma versão que iara-perception já resolve; não adiciona código novo ao grafo.
iara-cfc = { path = "vendor/iara-cfc" }
bevy = { version = "0.16.0", default-features = false, features = [
    "bevy_pbr",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_asset",
    "bevy_winit",
    "bevy_text",
    "bevy_ui",
    "bevy_gizmos", # Essencial para depuração metafísica
    "bevy_state",
    "x11",
    "tonemapping_luts",
    "default_font",
    "multi_threaded"
] }
bitflags = "2.6"
# GPU compute sem parte gráfica (ver src/gpu/): wgpu já vem pela árvore do Bevy.
wgpu = "24.0"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
rand = "0.9.0" # Versão ultra-rápida de 2026
libc = "0.2"  # fork/waitpid para isolar crashes de driver em gpu_validate
rayon = "1.10" # Paralelização CPU-bound (retina raycast pra 2000+ carros)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bevy_atmosphere = "0.13.0"
bevy_hanabi = "0.16.0"

[features]
default = ["survival_pressure", "simple_elitism", "trinity_swarm"]
# Trinity swarm + Tesla-style safety. Cortex+Reflex+Sentinel via MoE Gate.
# Ver docs/superpowers/specs/2026-04-25-trinity-swarm-safety-design.md
trinity_swarm = []
# Elitismo simples: slot 0 = champion puro, resto = champion + mutação.
# Coroação imediata se qualquer mutante bater champion (ignora validation-gate).
# Ver melhorias/simple-elitism.md
simple_elitism = []
# DEPRECATED: absorvido pelo Sentinel Tier 0 FCA. Habilitar só pra A/B regression.
sentinel_brake = []
# Compensa dynamic_steer_limit no neural steer (x1/limit cap 2). Ver melhorias/gain-asymmetry.md
gain_comp_steer = []
# Remove threshold 0.2 do brake spline (simetria com throttle).
brake_symmetric = []
# Pressão existencial extra: idle_brake_penalty + corner_fuel_burn + spin_hp_drain.
# Ver melhorias/survival-pressure.md
survival_pressure = []

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# Validação estática de WGSL sem GPU (parse + type-check via naga) — ver
# tests/wgsl_validation.rs. Mesma versão que wgpu 24.0 já traz transitivamente
# (Cargo.lock), só tornada direta e com a feature "wgsl-in" explícita: sem ela,
# `naga::front::wgsl` não compila (feature-gated) e a unificação de features do
# workspace não é algo para depender silenciosamente.
naga = { version = "24.0", features = ["wgsl-in"] }

[[bench]]
name = "bitlinear"
harness = false

# Binários: o Cargo descobre sozinho todo `src/bin/*.rs`, usando o nome do arquivo.
# Só declaramos aqui o que NÃO segue essa regra. Havia 13 declarações redundantes e, ao
# mesmo tempo, 8 binários sem declaração — inclusive o `gpu_evolve`, que é o caminho de
# produção. A mistura fazia parecer que os não-declarados estavam desativados.
# Adicionar uma ferramenta agora é só criar o arquivo.
[[bin]]
name = "universe-lab"
path = "src/bin/lab.rs"

