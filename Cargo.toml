[workspace]
# `iara_genesis` was moved to `docs/arquivo/dirs/iara_genesis` in the "removing
# trash" commit (2c71c69) without updating this manifest — the crate is NOT trash (it is a
# real dependency of `src/evolution/dna_genesis.rs`, `dna_view`, `dna_compress`,
# `generic_dna`), only the path became stale and broke EVERY `cargo build` of the
# workspace. Repointed to the new path; files were not moved back (avoids conflicting with
# the cleanup already done).
members = [".", "docs/arquivo/dirs/iara_genesis", "crates/taxi-world"]

[package]
name = "universe"
version = "0.2.0"
edition = "2024"
rust-version = "1.85.0" # Stable version in 2026
license = "MIT"
default-run = "universe"

[dependencies]
sha2 = "0.10.9"
iara_genesis = { path = "docs/arquivo/dirs/iara_genesis" }
iara-perception = { path = "vendor/iara-perception" }
# Was already a TRANSITIVE dependency via iara-perception (RetinaPerception uses CfcCell
# internally). Made direct so that `src/math/cfc_perception.rs` can reference
# `iara_cfc::CfcCell` without duplicating the equation — see that module's doc. Same crate,
# same version iara-perception already resolves; adds no new code to the graph.
iara-cfc = { path = "vendor/iara-cfc" }
bevy = { version = "0.16.0", default-features = false, features = [
    "bevy_pbr",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_asset",
    "bevy_winit",
    "bevy_text",
    "bevy_ui",
    "bevy_gizmos", # Essential for metaphysical debugging
    "bevy_state",
    "x11",
    "tonemapping_luts",
    "default_font",
    "multi_threaded"
] }
bitflags = "2.6"
# GPU compute without the graphics side (see src/gpu/): wgpu already comes via the Bevy tree.
wgpu = "24.0"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
rand = "0.9.0" # Ultra-fast 2026 version
libc = "0.2"  # fork/waitpid to isolate driver crashes in gpu_validate
rayon = "1.10" # CPU-bound parallelism (retina raycast for 2000+ cars)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bevy_atmosphere = "0.13.0"
bevy_hanabi = "0.16.0"

[build-dependencies]
sha2 = "0.10.9"

[features]
default = ["survival_pressure", "simple_elitism", "trinity_swarm"]
# Trinity swarm + Tesla-style safety. Cortex+Reflex+Sentinel via MoE Gate.
# See docs/superpowers/specs/2026-04-25-trinity-swarm-safety-design.md
trinity_swarm = []
# Simple elitism: slot 0 = pure champion, rest = champion + mutation.
# Immediate coronation if any mutant beats the champion (ignores the validation-gate).
# See melhorias/simple-elitism.md
simple_elitism = []
# DEPRECATED: absorbed by the Sentinel Tier 0 FCA. Enable only for A/B regression.
sentinel_brake = []
# Compensates dynamic_steer_limit on the neural steer (x1/limit cap 2). See melhorias/gain-asymmetry.md
gain_comp_steer = []
# Removes the 0.2 threshold from the brake spline (symmetry with throttle).
brake_symmetric = []
# Extra existential pressure: idle_brake_penalty + corner_fuel_burn + spin_hp_drain.
# See melhorias/survival-pressure.md
survival_pressure = []

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# Static WGSL validation without a GPU (parse + type-check via naga) — see
# src/gpu/wgsl_static_tests.rs. Same version wgpu 24.0 already brings transitively
# (Cargo.lock), only made direct and with the "wgsl-in" feature explicit: without it,
# `naga::front::wgsl` does not compile (feature-gated), and the workspace's feature
# unification is not something to depend on silently.
naga = { version = "24.0", features = ["wgsl-in"] }

[[bench]]
name = "bitlinear"
harness = false

# Binaries: Cargo discovers every `src/bin/*.rs` on its own, using the file name.
# We only declare here what does NOT follow that rule. There were 13 redundant
# declarations and, at the same time, 8 binaries with no declaration — including
# `gpu_evolve`, which is the production path. The mix made the undeclared ones look
# disabled. Adding a tool now is just creating the file.
[[bin]]
name = "universe-lab"
path = "src/bin/lab.rs"

