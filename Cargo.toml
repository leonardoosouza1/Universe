[package]
name = "universe"
version = "0.2.0"
edition = "2024"
rust-version = "1.85.0" # Versão estável em 2026

[dependencies]
bevy = { version = "0.16.0", default-features = false, features = [
    "bevy_pbr",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_asset",
    "bevy_winit",
    "bevy_text",
    "bevy_ui",
    "bevy_gizmos", # Essencial para depuração metafísica
    "x11",
    "tonemapping_luts",
    "default_font",
    "multi_threaded"
] }
rand = "0.9.0" # Versão ultra-rápida de 2026
