<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IARA // SOVEREIGN COMMAND</title>
    <style>
        :root {
            --bg-deep: #05070a;
            --panel-bg: #0a0f14;
            --accent: #00f2ff;
            --accent-dim: rgba(0, 242, 255, 0.2);
            --danger: #ff0055;
            --text-main: #a0adba;
            --border: #1a222d;
        }

        body {
            background: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            height: 50px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
            letter-spacing: 2px;
            font-weight: 800;
            font-size: 14px;
            color: var(--accent);
        }

        .status-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; display: inline-block; margin-right: 10px; box-shadow: 0 0 10px var(--accent); }

        main {
            display: grid;
            grid-template-columns: 320px 1fr 380px;
            gap: 10px;
            padding: 10px;
            flex: 1;
            min-height: 0;
        }

        .module {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            border-radius: 4px;
            overflow: hidden;
        }

        .module-header {
            background: var(--border);
            color: #fff;
            padding: 6px 12px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 12px;
        }

        .stat-card { border-left: 2px solid var(--accent); padding-left: 10px; }
        .stat-label { font-size: 8px; color: #566573; text-transform: uppercase; }
        .stat-value { font-size: 16px; font-weight: bold; color: #fff; }

        /* NEURON CHART - CORREÇÃO DO ESTOURO */
        #neuron-chart {
            flex: 1;
            display: flex;
            align-items: flex-end;
            gap: 2px;
            padding: 10px;
            background: #000;
            min-height: 150px;
        }

        .neuron-bar {
            flex: 1;
            background: #0d141a;
            height: 100%;
            position: relative;
        }

        .neuron-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: var(--accent);
            max-height: 100%;
        }

        /* VISION AREA */
        #external-vision { width: 100%; aspect-ratio: 16/9; background: #000; border-bottom: 1px solid var(--border); }
        #perception-wave { width: 100%; height: 100px; background: #000; }

        /* DNA MATRIX - CORREÇÃO VISUAL */
        #dna-matrix {
            display: grid;
            grid-template-columns: repeat(32, 1fr);
            gap: 1px;
            padding: 5px;
            overflow-y: auto;
            flex: 1;
        }

        .dna-bit { aspect-ratio: 1; background: #111; }
        .bit-pos { background: var(--accent); }
        .bit-neg { background: var(--danger); }

        footer {
            height: 120px;
            margin: 0 10px 10px 10px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            font-family: monospace;
            font-size: 11px;
            padding: 8px;
            overflow-y: auto;
            color: #00cc99;
        }
        .log-tag { color: var(--accent); font-weight: bold; margin-right: 8px; }
    </style>
</head>
<body>
    <header>
        <div><span class="status-dot"></span>IARA // SOVEREIGN_COMMAND</div>
        <div id="ad-warning" style="display:none; color: var(--danger)">[!] AD INTERFERENCE</div>
        <div id="conn-info">CONNECTED: 3000</div>
    </header>

    <main>
        <section class="module">
            <div class="module-header">Brain Metabolism</div>
            <div class="metrics-grid">
                <div class="stat-card"><div class="stat-label">Energy</div><div class="stat-value" id="val-energy">0.0</div></div>
                <div class="stat-card"><div class="stat-label">Fatigue</div><div class="stat-value" id="val-fatigue">0.0</div></div>
                <div class="stat-card"><div class="stat-label">Queue</div><div class="stat-value" id="val-queue">0</div></div>
                <div class="stat-card">
                    <div class="stat-label">Visited</div>
                    <div class="stat-value" id="val-visited">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Ingestion Mode</div>
                    <div class="stat-value" id="val-mode" style="color:var(--accent)">IDLE</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Active Workers</div>
                    <div class="stat-value" id="val-workers" style="color:#ffcc00">0</div>
                </div>
                </div>            <div class="module-header">Instinct Outputs</div>
            <div id="neuron-chart"></div>
        </section>

        <section class="module">
            <div class="module-header">Semantic Digestion Stream</div>
            <div id="text-stream" style="width: 100%; height: 250px; background: #000; border-bottom: 1px solid var(--border); color: #0f0; font-family: monospace; font-size: 11px; overflow-y: auto; padding: 10px; box-sizing: border-box; white-space: pre-wrap; word-wrap: break-word;">Awaiting Data...</div>
            <div class="module-header" style="background:#000">Perception Waveform</div>
            <canvas id="perception-wave"></canvas>
        </section>

        <section class="module">
            <div class="module-header">DNA Bitstream</div>
            <div id="dna-matrix"></div>
        </section>
    </main>

    <footer id="console-log"></footer>

    <script>
        const ws = new WebSocket(`ws://${window.location.host}/ws`);
        const logBox = document.getElementById('console-log');
        const dnaMatrix = document.getElementById('dna-matrix');
        const neuronChart = document.getElementById('neuron-chart');
        const waveCanvas = document.getElementById('perception-wave');
        const waveCtx = waveCanvas.getContext('2d');

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            document.getElementById('val-energy').innerText = data.energy.toFixed(3);
            document.getElementById('val-fatigue').innerText = data.fatigue.toFixed(3);
            document.getElementById('val-queue').innerText = data.queue_size || 0;
            document.getElementById('val-visited').innerText = data.visited_count || 0;
            document.getElementById('val-mode').innerText = data.mode || "IDLE";
            document.getElementById('val-mode').style.color = data.mode === "VIDEO" ? "#ff0055" : "#00f2ff";
            document.getElementById('val-workers').innerText = data.active_workers || 0;
            
            if (data.text_stream) {
                const streamDiv = document.getElementById('text-stream');
                streamDiv.innerText = data.text_stream;
                streamDiv.scrollTop = streamDiv.scrollHeight;
            }

            // NEURONS - Reconstrução dinâmica para evitar estouro
            if (neuronChart.childNodes.length !== data.neuron_outputs.length) {
                neuronChart.innerHTML = '';
                data.neuron_outputs.forEach(() => {
                    const bar = document.createElement('div');
                    bar.className = 'neuron-bar';
                    bar.innerHTML = '<div class="neuron-fill"></div>';
                    neuronChart.appendChild(bar);
                });
            }
            data.neuron_outputs.forEach((v, i) => {
                // Normalização visual: v é mapeado para 0-100%
                const fill = neuronChart.childNodes[i].firstChild;
                const height = Math.min(100, Math.max(0, (v + 1.0) * 50));
                fill.style.height = `${height}%`;
            });

            // DNA - Atualização de cores
            if (dnaMatrix.childNodes.length === 0) {
                for(let i=0; i<data.dna_sample.length; i++) {
                    const d = document.createElement('div');
                    d.className = 'dna-bit';
                    dnaMatrix.appendChild(d);
                }
            }
            data.dna_sample.forEach((v, i) => {
                const bit = dnaMatrix.childNodes[i];
                bit.className = 'dna-bit ' + (v > 0 ? 'bit-pos' : (v < 0 ? 'bit-neg' : ''));
            });

            // WAVEFORM
            waveCtx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
            waveCtx.strokeStyle = '#00f2ff';
            waveCtx.beginPath();
            const sw = waveCanvas.width / data.sensory_wave.length;
            data.sensory_wave.forEach((v, i) => {
                const y = (v + 128) / 255 * waveCanvas.height;
                if (i === 0) waveCtx.moveTo(0, y); else waveCtx.lineTo(i * sw, y);
            });
            waveCtx.stroke();

            if (data.log) {
                const l = document.createElement('div');
                l.innerHTML = `<span class="log-tag">[${new Date().toLocaleTimeString()}]</span> ${data.log}`;
                logBox.prepend(l);
                if (logBox.childNodes.length > 50) logBox.removeChild(logBox.lastChild);
            }
        };
    </script>
</body>
</html>
