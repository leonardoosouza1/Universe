[package]
name = "iara_agi"
version = "0.1.0"
edition = "2021"

[dependencies]
# O Cérebro
tokio = { version = "1.36", features = ["full"] }
futures = "0.3.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# O Olho (Browser Vision)
chromiumoxide = "0.9.1"

# O Laboratório (Web Server)
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs"] }
crossbeam-channel = "0.5"

# A Matemática
rand = "0.8"
approx = "0.5"
base64 = "0.21"
lazy_static = "1.4"
image = "0.24"
sysinfo = "0.30"
